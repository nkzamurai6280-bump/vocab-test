<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="単語テスト">
  <meta name="theme-color" content="#2446a8">
  <title>英単語ターゲット1900 書き込みテスト</title>
  <style>
:root {
  --ink: #17243d;
  --muted: #5d6b84;
  --paper: #eef1f6;
  --card: #ffffff;
  --line: #d3dae7;
  --accent: #2446a8;
  --accent-ink: #ffffff;
  --ok: #1f7a55;
  --ok-bg: #e4f3ec;
  --ng: #c23b2e;
  --ng-bg: #fbe8e5;
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e6ebf5;
    --muted: #98a5bd;
    --paper: #111826;
    --card: #1a2336;
    --line: #2d3a54;
    --accent: #7d9bf0;
    --accent-ink: #0d1424;
    --ok: #67cf9f;
    --ok-bg: #16322a;
    --ng: #ff8f82;
    --ng-bg: #3a1f1e;
  }
}

:root[data-theme="dark"] {
  --ink: #e6ebf5;
  --muted: #98a5bd;
  --paper: #111826;
  --card: #1a2336;
  --line: #2d3a54;
  --accent: #7d9bf0;
  --accent-ink: #0d1424;
  --ok: #67cf9f;
  --ok-bg: #16322a;
  --ng: #ff8f82;
  --ng-bg: #3a1f1e;
}

* { box-sizing: border-box; }

html, body { margin: 0; }
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 640px;
  margin: 0 auto;
  padding: 32px 20px 64px;
}

[hidden] { display: none !important; }

h1 {
  font-size: 1.5rem;
  line-height: 1.3;
  margin: 0 0 24px;
  letter-spacing: 0.02em;
}
h1 span {
  display: block;
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--muted);
  margin-top: 4px;
}
h2 { font-size: 1.05rem; margin: 0 0 16px; }

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}

.field { margin-bottom: 20px; }
.field > label:not(.check) {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
}

.range-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sep { color: var(--muted); }

input[type="number"], input[type="text"] {
  font: inherit;
  color: inherit;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
}
input[type="number"] { width: 110px; }
input:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 6px; width: 16px; height: 16px; }

.note { color: var(--muted); font-size: 0.9rem; }
.error { color: var(--ng); min-height: 1.5em; margin: 12px 0 0; font-size: 0.9rem; }

.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.presets button { padding: 4px 12px; font-size: 0.85rem; }

button {
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 18px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
button.primary:hover { filter: brightness(1.08); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.link {
  border: none;
  background: none;
  color: var(--muted);
  padding: 0;
  font-weight: 500;
  text-decoration: underline;
}

.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
#btn-start { width: 100%; padding: 12px; font-size: 1.05rem; }

.wrong-summary { margin: 0 0 14px; }
.wrong-summary strong { font-size: 1.6rem; color: var(--ng); }

/* テスト画面 */
.quiz-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 8px;
}
#quiz-progress { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
#bar-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 32px 24px 24px;
}
.card-no { color: var(--muted); font-size: 0.85rem; text-align: center; }
.card-word {
  font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: clamp(2.2rem, 9vw, 3.4rem);
  text-align: center;
  margin: 4px 0 28px;
  word-break: break-word;
}

#answer { width: 100%; font-size: 1.1rem; margin-bottom: 14px; }

.verdict {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 1.1rem;
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
}
.verdict .mark { font-size: 1.8rem; line-height: 1; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.ng { background: var(--ng-bg); color: var(--ng); }

dl { margin: 0 0 20px; }
dt { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
dd { margin: 2px 0 0; font-size: 1.05rem; }
#fb-correct { font-weight: 600; }

/* 結果・一覧 */
.score-panel { text-align: center; }
.score { font-size: 3rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.2rem; color: var(--muted); margin-left: 4px; font-weight: 500; }
.score-rate { color: var(--muted); }

.word-list { list-style: none; margin: 0; padding: 0; }
.word-list li {
  display: grid;
  grid-template-columns: 3.2em 1fr auto;
  gap: 4px 12px;
  align-items: baseline;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.word-list li:last-child { border-bottom: none; }
.word-list .no { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.word-list .en { font-family: Georgia, serif; font-weight: 700; font-size: 1.1rem; }
.word-list .ja { grid-column: 2 / 4; color: var(--muted); font-size: 0.92rem; }
.word-list button { padding: 2px 10px; font-size: 0.8rem; }
.empty { color: var(--muted); margin: 0; }

@media (prefers-reduced-motion: reduce) {
  #bar-fill { transition: none; }
}

.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tabs button { flex: 1; padding: 10px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
summary { cursor: pointer; font-weight: 600; }
textarea { width: 100%; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
.card-word.long { font-size: clamp(1.4rem, 5.5vw, 2rem); }
</style>
</head>
<body>
<main>

  <!-- 設定画面 -->
  <section id="screen-setup" class="screen">
    <h1>英単語・英熟語ターゲット<span>英→日 書き込みテスト</span></h1>

    <div class="tabs" id="mode-tabs" role="tablist">
      <button type="button" role="tab" data-mode="word">英単語 1900</button>
      <button type="button" role="tab" data-mode="idiom">英熟語 1000</button>
    </div>

    <details class="panel" id="idiom-import" hidden>
      <summary>熟語データの取り込み（<span id="idiom-count">未取り込み</span>）</summary>
      <p class="note">「英熟語ターゲット1000 熟語一覧」の表（No・熟語・意味）をコピーして、下に貼り付けてください。取り込んだデータはこの端末に保存されます。</p>
      <textarea id="idiom-text" rows="6" placeholder="1  a piece of ～  １つの～&#10;2  a couple of ～  ２つの～、２，３の～"></textarea>
      <div class="btn-row"><button type="button" class="primary" id="btn-idiom-import">取り込む</button></div>
      <p class="note" id="idiom-status" role="status"></p>
    </details>

    <div class="panel">
      <h2>テストの設定</h2>

      <div class="field">
        <label for="range-from">出題範囲（単語番号）</label>
        <div class="range-row">
          <input type="number" id="range-from" min="1" max="1900" value="1">
          <span class="sep">〜</span>
          <input type="number" id="range-to" min="1" max="1900" value="1900">
        </div>
        <div class="presets" id="presets">
          <button type="button" data-from="1" data-to="500">1–500</button>
          <button type="button" data-from="501" data-to="1000">501–1000</button>
          <button type="button" data-from="1001" data-to="1500">1001–1500</button>
          <button type="button" data-from="1501" data-to="1900">1501–1900</button>
          <button type="button" data-from="1" data-to="1900">全範囲</button>
        </div>
      </div>

      <div class="field">
        <label for="count">問題数</label>
        <div class="range-row">
          <input type="number" id="count" min="1" value="20">
          <span class="note" id="range-info"></span>
        </div>
      </div>

      <div class="field">
        <label class="check">
          <input type="checkbox" id="auto-judge" checked>
          入力した答えを自動で判定する（あとで手動で直せます）
        </label>
      </div>

      <button type="button" class="primary" id="btn-start">テスト開始</button>
      <p class="error" id="setup-error" role="alert"></p>
    </div>

    <div class="panel">
      <h2>間違えた単語</h2>
      <p class="wrong-summary"><strong id="wrong-count">0</strong> 語が記録されています</p>
      <div class="btn-row">
        <button type="button" class="primary" id="btn-retest-all">この単語だけで再テスト</button>
        <button type="button" id="btn-show-wrong">一覧を見る</button>
      </div>
    </div>
  </section>

  <!-- テスト画面 -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="quiz-head">
      <span id="quiz-mode"></span>
      <span id="quiz-progress"></span>
      <button type="button" class="link" id="btn-quit">中断する</button>
    </div>
    <div class="bar"><div id="bar-fill"></div></div>

    <div class="card">
      <div class="card-no" id="card-no"></div>
      <div class="card-word" id="card-word"></div>

      <div id="answer-area">
        <input type="text" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="日本語の意味を入力（Enterで判定）">
        <div class="btn-row">
          <button type="button" class="primary" id="btn-submit">判定する</button>
          <button type="button" id="btn-skip">わからない</button>
        </div>
      </div>

      <div id="feedback" hidden>
        <div class="verdict" id="verdict"></div>
        <dl>
          <dt>あなたの答え</dt><dd id="fb-user"></dd>
          <dt>正しい意味</dt><dd id="fb-correct"></dd>
        </dl>
        <div class="btn-row">
          <button type="button" class="primary" id="btn-next">次へ（Enter）</button>
          <button type="button" id="btn-toggle">判定を変更する</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen" hidden>
    <h1>結果</h1>
    <div class="panel score-panel">
      <div class="score"><span id="score-num"></span><small id="score-total"></small></div>
      <div class="score-rate" id="score-rate"></div>
    </div>

    <div class="panel" id="result-wrong-panel">
      <h2>間違えた単語</h2>
      <ul class="word-list" id="result-wrong-list"></ul>
    </div>

    <div class="btn-row">
      <button type="button" class="primary" id="btn-retest-session">今回の間違いだけ再テスト</button>
      <button type="button" id="btn-retest-stored">記録済みの間違い全部で再テスト</button>
      <button type="button" id="btn-back-setup">設定に戻る</button>
    </div>
  </section>

  <!-- 間違い一覧画面 -->
  <section id="screen-wrong" class="screen" hidden>
    <h1>間違えた単語の一覧</h1>
    <p class="note">再テストで正解した単語は自動的にこの一覧から外れます。</p>
    <div class="panel">
      <ul class="word-list" id="wrong-list"></ul>
      <p class="empty" id="wrong-empty" hidden>記録されている単語はありません。</p>
    </div>
    <div class="btn-row">
      <button type="button" class="primary" id="btn-wrong-retest">この単語だけで再テスト</button>
      <button type="button" id="btn-wrong-clear">すべて削除</button>
      <button type="button" id="btn-wrong-back">設定に戻る</button>
    </div>
  </section>

</main>

（⇔ prose 散文）；詩"},{"n":1859,"w":"congestion","m":"混雑"},{"n":1860,"w":"sewage","m":"下水"},{"n":1861,"w":"complement","m":"（～の）補完物，補足（to）；（文法の）補語"},{"n":1862,"w":"subsidy","m":"補助金；報奨金"},{"n":1863,"w":"mortgage","m":"住宅ローン；抵当（権）"},{"n":1864,"w":"attorney","m":"【米】 弁護士；代理人"},{"n":1865,"w":"outfit","m":"衣装一式；装備［道具］一式；組織"},{"n":1866,"w":"bulk","m":"〔the ～〕（～の）大半（of）；大きさ；大量"},{"n":1867,"w":"reunion","m":"再会（の集い）；再結合"},{"n":1868,"w":"synthesis","m":"合成；総合（⇔ analysis ⇒ 363）"},{"n":1869,"w":"mold","m":"鋳型；鋳物；性格；かび"},{"n":1870,"w":"thirst","m":"（のどの）渇き；（～に対する）渇望（for）"},{"n":1871,"w":"greed","m":"強欲"},{"n":1872,"w":"bribe","m":"賄賂"},{"n":1873,"w":"contempt","m":"軽蔑；恥辱"},{"n":1874,"w":"texture","m":"感触，手触り；本質；質感"},{"n":1875,"w":"orphan","m":"孤児"},{"n":1876,"w":"harassment","m":"嫌がらせ，ハラスメント"},{"n":1877,"w":"hay","m":"干し草"},{"n":1878,"w":"doctrine","m":"教義；【米】（政策上の）主義"},{"n":1879,"w":"holistic","m":"全体論の；（医療が）ホリスティックの"},{"n":1880,"w":"liable","m":"しがちな；（～を）受けやすい（to）；責任がある"},{"n":1881,"w":"earnest","m":"まじめな，熱心な"},{"n":1882,"w":"intelligible","m":"（簡単に）理解できる"},{"n":1883,"w":"abrupt","m":"突然の（≒ sudden）"},{"n":1884,"w":"reckless","m":"無謀な；（～を）顧みない（of）"},{"n":1885,"w":"furious","m":"激怒した；猛烈な"},{"n":1886,"w":"eloquent","m":"雄弁な；説得力のある"},{"n":1887,"w":"juvenile","m":"青少年の"},{"n":1888,"w":"notorious","m":"悪名高い（≒ infamous）"},{"n":1889,"w":"timid","m":"臆病な；内気な"},{"n":1890,"w":"humid","m":"湿気のある（≒ muggy 蒸し暑い）"},{"n":1891,"w":"contagious","m":"感染（性）の；病気を伝染する"},{"n":1892,"w":"cynical","m":"冷笑的な，皮肉な"},{"n":1893,"w":"dumb","m":"ばかげた；口のきけない；無言の"},{"n":1894,"w":"monotonous","m":"単調な"},{"n":1895,"w":"perpetual","m":"永続的な；ひっきりなしの"},{"n":1896,"w":"dizzy","m":"目まいがする；当惑した"},{"n":1897,"w":"weary","m":"疲れ果てた；（～に）うんざりした（of）"},{"n":1898,"w":"numb","m":"麻痺した，無感覚な；ぼう然とした"},{"n":1899,"w":"mortal","m":"致命的な（≒ fatal）；死すべき（運命の）（⇔ immortal 不死の）"},{"n":1900,"w":"zealous","m":"熱心な；熱狂的な"}];

<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  let MAX_NO = WORDS.length;
  const LS_WORD = 'vt1900.wrong';
  const LS_IDIOM_WRONG = 'vt1900.idiom.wrong';
  const LS_IDIOM_DATA = 'vt1900.idiom.data';
  const LS_MODE = 'vt1900.mode';
  const LS_SETTINGS = 'vt1900.settings';
  let LS_WRONG = LS_WORD;
  let MODE = 'word';

  let DATA = WORDS;
  let byNo = new Map(DATA.map((w) => [w.n, w]));

  /* ---------- 保存まわり ---------- */
  const load = (key, fallback) => {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) {
      return fallback;
    }
  };
  const save = (key, value) => {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) { /* 保存できない環境では記録なしで動かす */ }
  };

  let wrongSet = new Set(load(LS_WRONG, []).filter((n) => byNo.has(n)));
  const saveWrong = () => save(LS_WRONG, [...wrongSet].sort((a, b) => a - b));

  /* ---------- 画面切り替え ---------- */
  const screens = ['setup', 'quiz', 'result', 'wrong'];
  const show = (name) => {
    screens.forEach((s) => { $('#screen-' + s).hidden = s !== name; });
    window.scrollTo(0, 0);
    if (name === 'setup') renderSetup();
    if (name === 'quiz') $('#answer').focus();
  };

  /* ---------- ユーティリティ ---------- */
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const esc = (s) => s.replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  /* ---------- 自動判定 ---------- */
  // 意味の文字列から「正解になりうる語句」の候補を取り出す
  const LEADING_PARTICLES = /^[をにがとのへで]+/;
  const normalize = (s) => s.replace(/[\s　～〜~…]/g, '').replace(LEADING_PARTICLES, '');

  function candidates(meaning) {
    let s = meaning
      .replace(/⇒\s*\d+/g, '')
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/〔[^〕]*〕/g, '')
      .replace(/【[^】]*】/g, '')
      .replace(/\[[^\]]*\]/g, '')
      .replace(/\s*=\s*[A-Za-z][^；，、]*/g, '')
      .replace(/[≒⇔][^；，、]*/g, '');
    const extra = [];
    s = s.replace(/［([^］]*)］/g, (_, inner) => { extra.push(inner); return ''; });
    return s.split(/[；，、,①-⑳]/).concat(extra)
      .map(normalize)
      .filter((c) => c.length > 0);
  }

  const hasSubstance = (u) => /[\u4e00-\u9fff\u30a0-\u30ff]/.test(u) || u.length >= 4;

  function autoJudge(input, meaning) {
    const u = normalize(input);
    if (!u) return false;
    return candidates(meaning).some((c) => (
      c === u ||
      (u.length >= 2 && hasSubstance(u) && c.includes(u)) ||
      (c.length >= 2 && hasSubstance(c) && u.includes(c))
    ));
  }

  // 2度押しで確定する確認（confirmダイアログが使えない環境でも動く）
  function confirmTwice(btn, armedText, action) {
    if (btn.dataset.armed) {
      clearTimeout(+btn.dataset.timer);
      btn.textContent = btn.dataset.orig;
      delete btn.dataset.armed;
      action();
      return;
    }
    btn.dataset.orig = btn.textContent;
    btn.dataset.armed = '1';
    btn.textContent = armedText;
    btn.dataset.timer = setTimeout(() => {
      btn.textContent = btn.dataset.orig;
      delete btn.dataset.armed;
    }, 3000);
  }

  /* ---------- 単語／熟語モード ---------- */
  const PRESETS = {
    word: [[1, 500], [501, 1000], [1001, 1500], [1501, 1900], [1, 1900]],
    idiom: [[1, 250], [251, 500], [501, 750], [751, 1000], [1, 1000]],
  };
  const settingsKey = () => LS_SETTINGS + (MODE === 'idiom' ? '.idiom' : '');

  let IDIOMS = (() => {
    const d = load(LS_IDIOM_DATA, []);
    return Array.isArray(d) ? d.filter((x) => x && x.n && x.w && x.m) : [];
  })();

  // サイトの表（No・熟語・意味）をコピーしたテキストを読み取る
  function parseIdioms(text) {
    const KANA = /[\u3040-\u30ff\u4e00-\u9fff①-⑳（\uff10-\uff19]/;
    const hasJa = (t) => t !== '比較級' && KANA.test(t);
    const out = [];
    text.split(/\r?\n/).forEach((raw) => {
      const line = raw.replace(/\u00a0/g, ' ').trim();
      if (!line) return;
      let n = 0, w = '', mean = '', m;
      if (line.includes('\t')) {
        const p = line.split('\t').map((s) => s.trim()).filter(Boolean);
        if (p.length >= 3 && /^\d+$/.test(p[0])) { n = +p[0]; w = p[1]; mean = p.slice(2).join(' '); }
      } else if ((m = line.match(/^(\d{1,4})\s+(.+)$/))) {
        const toks = m[2].split(/\s+/);
        const k = toks.findIndex(hasJa);
        if (k > 0) { n = +m[1]; w = toks.slice(0, k).join(' '); mean = toks.slice(k).join(' '); }
      }
      if (n && w && mean) out.push({ n, w, m: mean });
      else if (out.length && !/^\d/.test(line) && KANA.test(line)) out[out.length - 1].m += ' ' + line;
    });
    const seen = new Set();
    return out.filter((x) => !seen.has(x.n) && seen.add(x.n));
  }

  function setMode(m) {
    MODE = m;
    DATA = m === 'idiom' ? IDIOMS : WORDS;
    byNo = new Map(DATA.map((x) => [x.n, x]));
    MAX_NO = DATA.length ? Math.max(...DATA.map((x) => x.n)) : 0;
    LS_WRONG = m === 'idiom' ? LS_IDIOM_WRONG : LS_WORD;
    wrongSet = new Set(load(LS_WRONG, []).filter((n) => byNo.has(n)));
    save(LS_MODE, m);
    renderMode();
  }

  function renderMode() {
    const idiom = MODE === 'idiom';
    document.querySelectorAll('#mode-tabs button').forEach((b) =>
      b.setAttribute('aria-selected', String(b.dataset.mode === MODE)));
    $('#idiom-import').hidden = !idiom;
    $('#idiom-count').textContent = IDIOMS.length ? `${IDIOMS.length}件` : '未取り込み';
    if (idiom && !IDIOMS.length) $('#idiom-import').open = true;
    $('#presets').innerHTML = PRESETS[MODE].map(([a, b], i, arr) =>
      `<button type="button" data-from="${a}" data-to="${b}">${i === arr.length - 1 ? '全範囲' : a + '–' + b}</button>`).join('');
    el.from.max = el.to.max = MAX_NO;
    restoreSettings();
    renderSetup();
  }

  $('#btn-idiom-import').addEventListener('click', () => {
    const list = parseIdioms($('#idiom-text').value);
    const st = $('#idiom-status');
    if (list.length < 20) {
      st.textContent = `読み取れたのは${list.length}件でした。表（No・熟語・意味）をそのままコピーして貼り付けてください。`;
      return;
    }
    list.sort((a, b) => a.n - b.n);
    IDIOMS = list;
    save(LS_IDIOM_DATA, list);
    st.textContent = `${list.length}件を取り込みました。`;
    $('#idiom-text').value = '';
    $('#idiom-import').open = false;
    setMode('idiom');
  });

  /* ---------- 設定画面 ---------- */
  const el = {
    from: $('#range-from'),
    to: $('#range-to'),
    count: $('#count'),
    info: $('#range-info'),
    auto: $('#auto-judge'),
    error: $('#setup-error'),
  };

  function readRange() {
    let from = parseInt(el.from.value, 10);
    let to = parseInt(el.to.value, 10);
    if (Number.isNaN(from)) from = 1;
    if (Number.isNaN(to)) to = MAX_NO;
    from = clamp(from, 1, MAX_NO);
    to = clamp(to, 1, MAX_NO);
    if (from > to) [from, to] = [to, from];
    return { from, to, size: to - from + 1 };
  }

  function updateRangeInfo() {
    const { size } = readRange();
    el.info.textContent = DATA.length ? `この範囲は ${size} 件です` : '熟語データがありません';
    el.count.max = size;
  }

  function renderSetup() {
    $('#wrong-count').textContent = wrongSet.size;
    $('#btn-retest-all').disabled = wrongSet.size === 0;
    updateRangeInfo();
    el.error.textContent = '';
  }

  function restoreSettings() {
    const s = load(settingsKey(), null);
    if (!s) {
      el.from.value = 1;
      el.to.value = MAX_NO || 1;
      return;
    }
    el.from.value = s.from;
    el.to.value = s.to;
    el.count.value = s.count;
    el.auto.checked = s.auto !== false;
  }

  function saveSettings() {
    save(settingsKey(), {
      from: +el.from.value, to: +el.to.value, count: +el.count.value, auto: el.auto.checked,
    });
  }

  [el.from, el.to].forEach((i) => i.addEventListener('input', updateRangeInfo));

  $('#presets').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-from]');
    if (!b) return;
    el.from.value = b.dataset.from;
    el.to.value = b.dataset.to;
    updateRangeInfo();
  });

  $('#btn-start').addEventListener('click', () => {
    if (!DATA.length) {
      el.error.textContent = '先に熟語データを取り込んでください。';
      return;
    }
    const { from, to, size } = readRange();
    let count = parseInt(el.count.value, 10);
    if (Number.isNaN(count) || count < 1) {
      el.error.textContent = '問題数は1以上の数字で入力してください。';
      return;
    }
    count = Math.min(count, size);
    // 入力欄を補正後の値に揃える
    el.from.value = from;
    el.to.value = to;
    el.count.value = count;
    saveSettings();

    const pool = DATA.filter((w) => w.n >= from && w.n <= to);
    startQuiz(shuffle(pool).slice(0, count), `${MODE === 'idiom' ? '熟語 ' : ''}${from}〜${to}`);
  });

  $('#btn-retest-all').addEventListener('click', retestStored);
  $('#btn-show-wrong').addEventListener('click', () => { renderWrongList(); show('wrong'); });

  /* ---------- テスト本体 ---------- */
  let quiz = null;

  function startQuiz(list, label) {
    quiz = {
      list,
      label,
      i: 0,
      results: [], // { word, ok, input }
      phase: 'answer',
      cur: null,
      auto: el.auto.checked,
    };
    show('quiz');
    renderQuestion();
  }

  function renderQuestion() {
    const w = quiz.list[quiz.i];
    quiz.phase = 'answer';
    quiz.cur = null;

    $('#quiz-mode').textContent = quiz.label;
    $('#quiz-progress').textContent = `${quiz.i + 1} / ${quiz.list.length}`;
    $('#bar-fill').style.width = `${(quiz.i / quiz.list.length) * 100}%`;
    $('#card-no').textContent = `No. ${w.n}`;
    $('#card-word').textContent = w.w;
    $('#card-word').classList.toggle('long', w.w.length > 14);

    $('#answer').value = '';
    $('#answer-area').hidden = false;
    $('#feedback').hidden = true;
    $('#answer').focus();
  }

  function submitAnswer(skipped) {
    if (quiz.phase !== 'answer') return;
    const w = quiz.list[quiz.i];
    const input = skipped ? '' : $('#answer').value.trim();
    const ok = skipped ? false : (quiz.auto ? autoJudge(input, w.m) : false);

    quiz.cur = { word: w, input, ok, manual: !quiz.auto && !skipped };
    quiz.phase = 'feedback';

    $('#answer-area').hidden = true;
    $('#feedback').hidden = false;
    $('#fb-user').textContent = input || '（無回答）';
    $('#fb-correct').textContent = w.m;
    $('#answer').blur();
    renderVerdict();
  }

  function renderVerdict() {
    const { ok, manual } = quiz.cur;
    const v = $('#verdict');
    v.className = 'verdict ' + (ok ? 'ok' : 'ng');
    const label = manual
      ? (ok ? '正解にしました' : '不正解（意味を見て、合っていれば判定を変更）')
      : (ok ? '正解' : '不正解');
    v.innerHTML = `<span class="mark">${ok ? '○' : '×'}</span><span>${label}</span>`;
    $('#btn-toggle').textContent = ok ? '不正解に変更する' : '正解に変更する';
  }

  function nextQuestion() {
    if (quiz.phase !== 'feedback') return;
    const { word, ok, input } = quiz.cur;
    quiz.results.push({ word, ok, input });

    // 間違いの記録を更新（正解したら記録から外す）
    if (ok) wrongSet.delete(word.n);
    else wrongSet.add(word.n);
    saveWrong();

    quiz.i += 1;
    if (quiz.i >= quiz.list.length) showResult();
    else renderQuestion();
  }

  $('#btn-submit').addEventListener('click', () => submitAnswer(false));
  $('#btn-skip').addEventListener('click', () => submitAnswer(true));
  $('#btn-next').addEventListener('click', nextQuestion);
  $('#btn-toggle').addEventListener('click', () => {
    quiz.cur.ok = !quiz.cur.ok;
    quiz.cur.manual = false;
    renderVerdict();
  });
  $('#btn-quit').addEventListener('click', (e) => {
    confirmTwice(e.currentTarget, 'もう一度押すと中断します', () => show('setup'));
  });

  // Enterキーの処理（IME変換確定のEnterは無視する）
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if (!quiz || $('#screen-quiz').hidden) return;
    if (e.target.tagName === 'BUTTON') return; // ボタン自身のクリックに任せる
    e.preventDefault();
    if (quiz.phase === 'answer') submitAnswer(false);
    else if (quiz.phase === 'feedback') nextQuestion();
  });

  /* ---------- 結果画面 ---------- */
  function wordItems(words, withRemove) {
    return words.map((w) => `
      <li>
        <span class="no">${w.n}</span>
        <span class="en">${esc(w.w)}</span>
        ${withRemove ? `<button type="button" data-remove="${w.n}">外す</button>` : '<span></span>'}
        <span class="ja">${esc(w.m)}</span>
      </li>`).join('');
  }

  function showResult() {
    $('#bar-fill').style.width = '100%';
    const total = quiz.results.length;
    const correct = quiz.results.filter((r) => r.ok).length;
    const wrongWords = quiz.results.filter((r) => !r.ok).map((r) => r.word)
      .sort((a, b) => a.n - b.n);
    quiz.sessionWrong = wrongWords;

    $('#score-num').textContent = correct;
    $('#score-total').textContent = `/ ${total}`;
    $('#score-rate').textContent = `正答率 ${Math.round((correct / total) * 100)}%`;

    $('#result-wrong-panel').hidden = wrongWords.length === 0;
    $('#result-wrong-list').innerHTML = wordItems(wrongWords, false);

    $('#btn-retest-session').hidden = wrongWords.length === 0;
    const storedOnly = wrongSet.size > wrongWords.length;
    $('#btn-retest-stored').hidden = !storedOnly;

    show('result');
  }

  $('#btn-retest-session').addEventListener('click', () => {
    startQuiz(shuffle(quiz.sessionWrong), '再テスト（今回の間違い）');
  });
  $('#btn-retest-stored').addEventListener('click', retestStored);
  $('#btn-back-setup').addEventListener('click', () => show('setup'));

  function retestStored() {
    const words = [...wrongSet].map((n) => byNo.get(n)).filter(Boolean);
    if (words.length === 0) return;
    startQuiz(shuffle(words), '再テスト（記録した間違い）');
  }

  /* ---------- 間違い一覧 ---------- */
  function renderWrongList() {
    const words = [...wrongSet].sort((a, b) => a - b).map((n) => byNo.get(n));
    $('#wrong-list').innerHTML = wordItems(words, true);
    $('#wrong-empty').hidden = words.length > 0;
    $('#btn-wrong-retest').disabled = words.length === 0;
    $('#btn-wrong-clear').disabled = words.length === 0;
  }

  $('#wrong-list').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-remove]');
    if (!b) return;
    wrongSet.delete(parseInt(b.dataset.remove, 10));
    saveWrong();
    renderWrongList();
  });
  $('#btn-wrong-retest').addEventListener('click', retestStored);
  $('#btn-wrong-clear').addEventListener('click', (e) => {
    confirmTwice(e.currentTarget, 'もう一度押すと全削除します', () => {
      wrongSet = new Set();
      saveWrong();
      renderWrongList();
    });
  });
  $('#btn-wrong-back').addEventListener('click', () => show('setup'));

  /* ---------- 起動 ---------- */
  $('#mode-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]');
    if (b && b.dataset.mode !== MODE) setMode(b.dataset.mode);
  });
  setMode(load(LS_MODE, 'word'));
  show('setup');
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
